name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The placeholder OAuth client is enough to build and run the end-to-end tests (Google is faked there)
      - run: cp .env.example .env
      - run: npx -y playwright@1 install --with-deps chromium
      - run: pnpm test:e2e
